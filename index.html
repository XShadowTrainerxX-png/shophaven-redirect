<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Return to ShopHaven</title><style>body{font-family:system-ui;background:#10243c;color:#f8f6f1;text-align:center;padding:12vh 20px}a{display:inline-block;background:#d6ab57;color:#10243c;padding:14px 22px;border-radius:10px;font-weight:700;text-decoration:none}</style></head><body><h1>ShopHaven</h1><p id="status">Return to the app to review your order status.</p><a id="return" href="shophaven://stripe/return?checkout=success">Open ShopHaven</a><script>const q=new URLSearchParams(location.search);const checkout=q.get('checkout')==='cancel'?'cancel':'success';const target='shophaven://stripe/return?checkout='+checkout;document.getElementById('return').href=target;document.getElementById('status').textContent=checkout==='cancel'?'Checkout was canceled. No payment was confirmed.':'Checkout finished. Open ShopHaven to verify your payment status in Order History.';location.replace(target);</script></body></html>
